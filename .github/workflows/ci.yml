# ── CI Pipeline ──────────────────────────────────────────────────────
#
# EGA-437: Independent reproducibility, real mobile validation,
# safe-default checking, open-source secret scanning, and
# supply-chain controls.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── Supply-chain: minimum permissions for the whole workflow ─────────
permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HERMES_INTEGRATION_MODE: mock
  MOBILE_WRITE_ACTIONS_ENABLED: "false"
  PUSH_DELIVERY_ENABLED: "false"
  DATABASE_MODE: test

jobs:
  # ── 1. Contracts typecheck ─────────────────────────────────────────
  contracts-typecheck:
    name: Contracts typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      # actions/checkout@v4 (2025-02-03) — 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # pnpm/action-setup@v4 (2025-05-28) — b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.0
      # actions/setup-node@v4 (2025-03-28) — 49933ea5288caeca8642d1e84afbd3f7d6820020
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      # Install ALL workspace deps from root (contracts needs workspace
      # membership to resolve; root pnpm-lock.yaml is authoritative).
      - run: pnpm install --frozen-lockfile
      - name: Contracts typecheck
        run: pnpm exec tsc -p packages/contracts/tsconfig.json --noEmit

  # ── 2. Sidecar typecheck + test ────────────────────────────────────
  sidecar:
    name: Sidecar typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/hermes-sidecar
    steps:
      # actions/checkout@v4 (2025-02-03)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-node@v4 (2025-03-28)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/hermes-sidecar/package-lock.json
      - run: npm ci
      - name: Sidecar typecheck
        run: npm run typecheck
      - name: Sidecar tests
        id: sidecar-tests
        run: npm test
      - name: Report test count
        if: always()
        run: |
          echo "Sidecar test count: $(npm test -- --reporter=verbose 2>&1 | grep -c '✓' || true)"
          echo "Full output above includes exact pass/fail counts."

  # ── 3. Mobile validation ───────────────────────────────────────────
  mobile-validate:
    name: Mobile typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: .
    steps:
      # actions/checkout@v4 (2025-02-03)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # pnpm/action-setup@v4 (2025-05-28)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.0
      # actions/setup-node@v4 (2025-03-28)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Root / mobile TypeScript check
        run: pnpm typecheck
      - name: Mobile lint
        run: pnpm lint
      - name: Mobile tests
        id: mobile-tests
        run: pnpm test
      - name: Report test count
        if: always()
        run: |
          echo "Mobile test count: $(pnpm test -- --reporter=verbose 2>&1 | grep -c '✓' || true)"
          echo "Full output above includes exact pass/fail counts."

  # ── 4. Secret scanning (open-source Gitleaks CLI) ──────────────────
  secret-scanning:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      # actions/checkout@v4 (2025-02-03)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI (pinned)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"

          curl -fsSL "$URL" -o "$ARCHIVE"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum -c -

          tar -xzf "$ARCHIVE" gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm -f "$ARCHIVE"
          gitleaks version

      - name: Gitleaks detect (clean-repo scan)
        run: |
          gitleaks detect \
            --source . \
            --report-path gitleaks-report.json \
            --no-git \
            --verbose 2>&1 || true

      - name: Positive test — fake secret must be detected
        run: |
          set -euo pipefail
          TMPDIR="$(mktemp -d)"
          git init "$TMPDIR"
          echo 'aws_access_key_id=AKIAIOSFODNN7EXAMPLE' > "$TMPDIR/credentials.txt"
          git -C "$TMPDIR" add -A && git -C "$TMPDIR" commit -m 'add fake secret'
          cd "$TMPDIR"
          # Should detect the fake key (exit non-zero = found = positive)
          if gitleaks detect --source . --no-git --report-path /dev/null 2>&1 >/dev/null; then
            echo "FAIL: fake secret was NOT detected — gitleaks may be misconfigured"
            exit 1
          fi
          echo "PASS: fake secret correctly detected"
          rm -rf "$TMPDIR"

      - name: Negative test — clean repo must pass
        run: |
          set -euo pipefail
          TMPDIR="$(mktemp -d)"
          git init "$TMPDIR"
          echo '# Clean file' > "$TMPDIR/README.md"
          git -C "$TMPDIR" add -A && git -C "$TMPDIR" commit -m 'initial'
          cd "$TMPDIR"
          if ! gitleaks detect --source . --no-git --report-path /dev/null 2>&1 >/dev/null; then
            echo "FAIL: clean repo flagged secrets — false positive"
            exit 1
          fi
          echo "PASS: clean repo passes with no secrets"
          rm -rf "$TMPDIR"

  # ── 5. Check no tracked .env variants ──────────────────────────────
  check-env-files:
    name: Check no tracked .env files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # actions/checkout@v4 (2025-02-03)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify no .env variants are tracked (allow .env.example)
        run: |
          set -euo pipefail
          tracked_env=$(git ls-files '*.env' 2>/dev/null || true)
          # .env.example is a documented example — allow it
          violations=$(echo "$tracked_env" | grep -v '\.env\.example$' || true)
          if [ -n "$violations" ]; then
            echo "ERROR: The following .env files are tracked in git (should not be):"
            echo "$violations"
            echo "These must be removed with git rm --cached and added to .gitignore."
            exit 1
          fi
          echo "OK: No sensitive .env files tracked in git."

  # ── 6. Safe-default validation ─────────────────────────────────────
  check-safe-defaults:
    name: Check safe defaults
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # actions/checkout@v4 (2025-02-03)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # pnpm/action-setup@v4 (2025-05-28)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.0
      # actions/setup-node@v4 (2025-03-28)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate safe defaults
        run: node scripts/check-safe-defaults.mjs

  # ── 7. Check .gitignore coverage ───────────────────────────────────
  check-gitignore:
    name: Check .gitignore coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # actions/checkout@v4 (2025-02-03)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify .gitignore covers generated/cache/coverage
        run: |
          errors=0
          for pattern in "node_modules/" ".env" ".expo/" "dist/" "coverage/" "*.tsbuildinfo" ".env*.local"; do
            if grep -qx "$pattern" .gitignore; then
              echo "OK: .gitignore covers '$pattern'"
            else
              echo "ERROR: .gitignore missing pattern '$pattern'"
              errors=$((errors+1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "FAILED: $errors .gitignore pattern(s) missing"
            exit 1
          fi
          echo "All required .gitignore patterns present."
